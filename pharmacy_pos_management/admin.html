<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الصيدلاني</title>
<style>
:root{--ink:#10201F;--teal:#0E5A57;--line:#D8E2E0;--bg:#F4F7F6}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,sans-serif}
nav{display:flex;background:var(--teal)} nav button{flex:1;padding:14px;border:0;background:none;color:#fff;font:inherit;cursor:pointer;opacity:.7}
nav button[aria-selected=true]{opacity:1;border-bottom:3px solid #F2A900}
main{max-width:760px;margin:auto;padding:12px;display:grid;gap:10px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button.b,a.b{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;padding:8px 12px;font:inherit;text-decoration:none;cursor:pointer}
.b.f{background:var(--teal);color:#fff} .b.d{border-color:#A12727;color:#A12727}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;flex:1;min-width:110px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
.m{color:#5B6E6C;font-size:14px}
</style></head><body>
<nav role="tablist"><button role="tab" data-t="due" aria-selected="true">تذكيرات اليوم</button>
<button role="tab" data-t="review" aria-selected="false">مراجعة المادة الفعالة</button>
<button role="tab" data-t="missing" aria-selected="false">أدوية بدون مادة فعالة</button></nav>
<main id="m"></main>
<script>
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k.filter(x=>x!=null));return e;};
const api=(u,b)=>fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const M=document.getElementById('m');
const msg=r=>`أهلاً ${r.name||''}، دواء ${r.product} اللي بتاخده بانتظام قرّب يخلص. تحب نجهزه لك ونوصله لحد البيت؟ — صيدلية بحبح`;
async function due(){
  const list=await api('/api/admin/reminders/due'); M.replaceChildren();
  if(!list.length) return M.append(h('p',{className:'m'},'لا توجد تذكيرات مستحقة اليوم.'));
  list.forEach(r=>M.append(h('div',{className:'c'},h('b',{},r.name||r.phone),` — ${r.product}`,
    h('div',{className:'m'},[r.area,r.phone].filter(Boolean).join(' · ')),
    h('div',{className:'r'},
      h('a',{className:'b f',target:'_blank',rel:'noopener',href:`https://wa.me/${r.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg(r))}`},'افتح واتساب'),
      h('button',{className:'b',onclick:async()=>{await api(`/api/admin/reminders/${r.id}/done`,{});due();}},'تم الإرسال'),
      h('button',{className:'b d',onclick:async()=>{if(confirm('إيقاف كل تذكيرات هذا العميل؟')){await api(`/api/admin/reminders/${r.id}/stop`,{});due();}}},'العميل طلب الإيقاف')))));
}
async function review(missing){
  const list=await api('/api/admin/review'+(missing?'?mode=missing':'')); M.replaceChildren();
  if(!list.length) return M.append(h('p',{className:'m'},'القائمة فاضية.'));
  list.forEach(p=>{
    const ai=h('input',{value:p.ai||'',placeholder:'المادة الفعالة (EN)',dir:'ltr'}),
      st=h('input',{value:p.strength||'',placeholder:'التركيز مثال 5mg',dir:'ltr'}),
      fm=h('input',{value:p.form||'',placeholder:'الشكل tablet / syrup',dir:'ltr'});
    const go=ok=>async()=>{await api('/api/admin/review/'+p.id,{ai:ai.value,strength:st.value,form:fm.value,ok});review(missing);};
    M.append(h('div',{className:'c'},h('b',{},p.name),h('div',{className:'m'},p.ai_source?`المصدر: ${p.ai_source}`:'لم يُستخرج'),
      h('div',{className:'r'},ai,st,fm),
      h('div',{className:'r'},h('button',{className:'b f',onclick:go(true)},'أؤكد'),h('button',{className:'b d',onclick:go(false)},'غير صحيح / لا تُستخدم'))));});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ({due,review:()=>review(false),missing:()=>review(true)})[b.dataset.t]();});
due();
</script></body></html>
