<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل تذكير علاج</title>
<style>
:root{--ink:#10201F;--teal:#0E5A57;--line:#D8E2E0;--bg:#F4F7F6}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,sans-serif}
header{background:var(--teal);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}header a{color:#fff}
main{max-width:560px;margin:auto;padding:12px;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:700}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px}
button{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:12px;font:inherit;cursor:pointer}
.hit{display:block;width:100%;text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:4px;padding:8px}
.m{color:#5B6E6C;font-size:13px}.ok{color:#1B7F4B;font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;background:#FFF1DC;padding:10px;border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
</style></head><body>
<header><b>تسجيل تذكير علاج شهري</b><a href="/admin">رجوع</a></header>
<main>
 <div class="m">للصيدلاني فقط: التسجيل هنا يعني إنك راجعت الروشتة وأكدت الدواء.</div>
 <label>رقم العميل<input id="ph" inputmode="tel" placeholder="01xxxxxxxxx"></label>
 <label>الاسم<input id="nm"></label>
 <label>المدينة / القرية<input id="ar"></label>
 <label>الدواء<input id="q" placeholder="ابحث بالاسم" autocomplete="off"></label><div id="hits"></div><div id="pick" class="ok"></div>
 <label>كل كام يوم؟<select id="cy"><option>30</option><option>60</option><option>90</option><option>14</option></select></label>
 <label>تاريخ آخر صرف<input id="lf" type="date"></label>
 <label class="chk"><input id="oi" type="checkbox"> العميل وافق صراحةً (سمعت منه بنفسي) على استلام تذكيرات واتساب من صيدلية بحبح، ويقدر يوقفها في أي وقت.</label>
 <button id="go">حفظ التذكير</button><div id="res" role="status"></div>
</main>
<script>
const $=s=>document.getElementById(s), h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e;};
let pid=null,t; $('lf').valueAsDate=new Date();

// قراءة بيانات العميل لو جاي من شاشة طلبات الموقع
const uParams = new URLSearchParams(location.search);
if (uParams.get('phone')) $('ph').value = uParams.get('phone');
if (uParams.get('name')) $('nm').value = uParams.get('name');
if (uParams.get('area')) $('ar').value = uParams.get('area');
if (uParams.get('phone')) $('oi').checked = true;

$('q').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{pid=null;$('pick').textContent='';const v=$('q').value.trim();if(!v)return $('hits').replaceChildren();
  const l=(await(await fetch('/api/search?q='+encodeURIComponent(v))).json()).slice(0,5);
  $('hits').replaceChildren(...l.map(p=>h('button',{className:'hit',type:'button',onclick:()=>{pid=p.id;$('pick').textContent='✓ '+p.name;$('hits').replaceChildren();}},p.name)));},200);};
$('go').onclick=async()=>{
  const ph=$('ph').value.replace(/\D/g,'').replace(/^0/,'20');
  if(ph.length<11||!pid) return $('res').textContent='اكتب رقم صحيح واختر الدواء من القائمة.';
  if(!$('oi').checked) return $('res').textContent='لازم موافقة العميل الصريحة قبل الحفظ.';
  const r=await fetch('/api/admin/reminders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,name:$('nm').value,area:$('ar').value,product_id:pid,cycle_days:+$('cy').value,last_filled:$('lf').value,opt_in:true})});
  const j=await r.json(); $('res').textContent=r.ok?`تم. أول تذكير يوم ${j.next_reminder_at}`:(j.error||'حصل خطأ');};
</script></body></html>
